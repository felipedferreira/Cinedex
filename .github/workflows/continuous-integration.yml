name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets images and deploys be run by hand from the selected ref without waiting
  # for a new commit. Manual runs deploy that ref's sha-* image tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: [self-hosted, cinedex, production]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "liquid.md;LogFileName=test-results.md"
          --results-directory TestResults

      - name: Publish test summary
        if: always()
        run: |
          if [ -f TestResults/test-results.md ]; then
            cat TestResults/test-results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    runs-on: [self-hosted, cinedex, production]

    permissions:
      contents: read
      pull-requests: write

    # `frontend/` is an npm workspace root (apps/* + packages/*); every script
    # below fans out to the workspaces from here.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      # Repo-wide rule, not a frontend one, but it lives in this job because this
      # job already has Node available and is already required to merge. The script
      # is dependency-free, so it runs before `npm ci` and fails fast.
      - name: Check diagrams (no ASCII box art)
        working-directory: .
        run: node scripts/check-diagrams.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run coverage

      # One report per workspace—the action reads a single coverage directory,
      # and the distinct names keep the job summaries apart.
      - name: Coverage summary (cinedex-app)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: cinedex-app
          working-directory: frontend/apps/cinedex-app

      # One per library tier. @cinedex/theme is absent on purpose—it ships CSS
      # and no JavaScript, so it has no test suite to report on.
      - name: Coverage summary (@cinedex/atoms)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@cinedex/atoms"
          working-directory: frontend/packages/atoms

      - name: Coverage summary (@cinedex/compounds)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@cinedex/compounds"
          working-directory: frontend/packages/compounds

      - name: Coverage summary (@cinedex/solution)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@cinedex/solution"
          working-directory: frontend/packages/solution

  resolve_deploy_image_tag:
    name: Resolve deploy image tag
    needs: [backend, frontend]
    # Publish only after both test jobs are green: automatically for pushes to
    # main, or manually for the selected dispatch ref. Never on a pull request.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
    steps:
      - id: image_tag
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment image tag"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME:-$GITHUB_REF}\`"
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- Image tag: \`$image_tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Build & push ${{ matrix.name }}
    needs: [backend, frontend]
    # Publish only after both test jobs are green: automatically for pushes to
    # main, or manually for the selected dispatch ref. Never on a pull request.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/felipedferreira/cinedex
    strategy:
      # One broken image should not hide the state of the other five.
      fail-fast: false
      matrix:
        include:
          # title/description become org.opencontainers.image.{title,description},
          # overriding metadata-action's repository-level defaults. The
          # description is what GHCR prints under the package name, so it is
          # written to stand alone there—one line, plain text, well under the
          # registry's 512-character ceiling. Each is the opening sentence of
          # that image's own README; see the note above the meta step.
          - name: webservice
            context: ./backend
            dockerfile: backend/src/Presentation/Cinedex.WebService/Dockerfile
            title: Cinedex Web Service
            description: >-
              The Cinedex REST API—the catalog of titles, cast and crew, plus
              authentication. Serves /movies-svc and its Scalar API reference.
          - name: migrator
            context: ./backend
            dockerfile: backend/src/Presentation/Cinedex.DatabaseMigrator/Dockerfile
            title: Cinedex Database Migrator
            description: >-
              A one-shot console application that applies all pending Entity
              Framework Core migrations for both the film and auth databases,
              then exits. Run it to completion before the web service starts.
          - name: schedulerworker
            context: ./backend
            dockerfile: backend/src/Presentation/Cinedex.SchedulerWorker/Dockerfile
            title: Cinedex Scheduler Worker
            description: >-
              The Cinedex background worker, running scheduled maintenance jobs
              such as the expired refresh-token cleanup.
          - name: app
            context: ./frontend
            dockerfile: frontend/apps/cinedex-app/Dockerfile
            title: Cinedex App
            description: >-
              The Cinedex single-page app—a React 19 and Vite bundle served as
              static files by Nginx.
          - name: storybook
            context: ./frontend
            dockerfile: frontend/apps/storybook/Dockerfile
            title: Cinedex Storybook
            description: >-
              The Storybook for Cinedex's three component tiers—@cinedex/atoms,
              @cinedex/compounds and @cinedex/solution—built as a static site.
          # Root context: /changelog is generated from the root CHANGELOG.md.
          - name: docs-site
            context: .
            dockerfile: frontend/apps/docs-site/Dockerfile
            title: Cinedex Docs Site
            description: >-
              A Docusaurus documentation site for Cinedex, branded to match the
              SPA and Storybook. Published at /documentation/.
            build-args: |
              DOCUSAURUS_BASE_URL=/documentation/
              STORYBOOK_BASE_URL=https://cinedex.online/storybook

    steps:
      - uses: actions/checkout@v6

      # The frontend workspace root's version is the repo's release version—the
      # release bumps it and backend/Directory.Build.props in one step, so either
      # would serve. This one reads without the .NET SDK, which this job (unlike
      # the backend one) does not install; node is preinstalled on ubuntu-latest.
      # The guard keeps a missing version from tagging six images "undefined".
      - id: version
        run: |
          version="$(node -p "require('./frontend/package.json').version")"
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "No version field in frontend/package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Tagging images \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also emits org.opencontainers.image.source, which links the GHCR
      # package back to this repository.
      #
      # GHCR has no per-image README: the body of a package page is the README
      # of whatever repository `source` points at, so all six necessarily show
      # this repo's root one. The only per-image prose the registry renders is
      # `description`, the line beneath the package name—which otherwise
      # defaults to the repository description, identical across all six. The
      # matrix carries the per-image text.
      #
      # It has to be set twice. Labels live in the image config, which GHCR
      # reads only for a plain single-arch image; when the push produces a
      # manifest list—any multi-arch build, and also a single-platform one
      # once build-push-action v6 attaches its default provenance
      # attestation—the package page reads the description off the index
      # instead, and an unannotated index falls back to the repository
      # description. So the same two keys go out as annotations as well.
      # metadata-action writes those at `manifest` level by default; `index`
      # is the level GHCR actually reads, and naming both keeps this correct
      # whichever shape the push takes.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ matrix.build-args }}
          # Scoped per image or the six builds evict each other's cache.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-all-services:
    name: Deploy all services
    needs: [images, resolve_deploy_image_tag]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/deploy-all-services.yml
    secrets: inherit
    permissions:
      contents: read
      packages: read
    with:
      image-tag: ${{ needs.resolve_deploy_image_tag.outputs.image_tag }}
