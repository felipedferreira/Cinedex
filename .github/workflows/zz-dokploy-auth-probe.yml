name: ZZ Dokploy auth probe

# TEMPORARY. Determines which Authorization header format the Dokploy API
# accepts, by trying each against a read-only endpoint and printing ONLY the
# resulting status code. The token itself is never echoed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Try each header format against project.all
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |
          base="${DOKPLOY_URL%/}/api/project.all"
          try() {
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H "$1: $2" "$base" || echo "ERR")"
            echo "  $3 -> $code"
          }
          echo "Results (200 = this format works):"
          try "Authorization" "$DOKPLOY_API_TOKEN"        "Authorization: <token>"
          try "Authorization" "Bearer $DOKPLOY_API_TOKEN" "Authorization: Bearer <token>"
          try "x-api-key"     "$DOKPLOY_API_TOKEN"        "x-api-key: <token>"
