name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the whole pipeline—images job included—be run by hand against any ref,
  # not just main. See the tag note on the images job for what a dispatch off
  # main publishes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: [self-hosted, cinedex, production]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "liquid.md;LogFileName=test-results.md"
          --results-directory TestResults

      - name: Publish test summary
        if: always()
        run: |
          if [ -f TestResults/test-results.md ]; then
            cat TestResults/test-results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    runs-on: [self-hosted, cinedex, production]

    permissions:
      contents: read
      pull-requests: write

    # `frontend/` is an npm workspace root (apps/* + packages/*); every script
    # below fans out to the workspaces from here.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      # Repo-wide rule, not a frontend one, but it lives in this job because this
      # job already has Node available and is already required to merge. The script
      # is dependency-free, so it runs before `npm ci` and fails fast.
      - name: Check diagrams (no ASCII box art)
        working-directory: .
        run: node scripts/check-diagrams.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run coverage

      # One report per workspace—the action reads a single coverage directory,
      # and the distinct names keep the job summaries apart.
      - name: Coverage summary (cinedex-app)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: cinedex-app
          working-directory: frontend/apps/cinedex-app

      # One per library tier. @cinedex/theme is absent on purpose—it ships CSS
      # and no JavaScript, so it has no test suite to report on.
      - name: Coverage summary (@cinedex/atoms)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@cinedex/atoms"
          working-directory: frontend/packages/atoms

      - name: Coverage summary (@cinedex/compounds)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@cinedex/compounds"
          working-directory: frontend/packages/compounds

      - name: Coverage summary (@cinedex/solution)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@cinedex/solution"
          working-directory: frontend/packages/solution

  images:
    name: Build & push ${{ matrix.name }}
    needs: [backend, frontend]
    # Publish once both test jobs are green: a push that lands on main, or a
    # manual dispatch of any ref. Never on a pull request.
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/felipedferreira/cinedex
    strategy:
      # One broken image should not hide the state of the other five.
      fail-fast: false
      matrix:
        include:
          # title becomes org.opencontainers.image.title, overriding
          # metadata-action's repository-level default. The matching
          # description is not written here: `readme` points at the image's own
          # README and the description step below lifts its opening paragraph,
          # so the registry text has a single source and cannot drift from the
          # doc. See the note above that step.
          - name: webservice
            context: ./backend
            dockerfile: backend/src/Presentation/Cinedex.WebService/Dockerfile
            title: Cinedex Web Service
            readme: backend/src/Presentation/Cinedex.WebService/README.md
          - name: migrator
            context: ./backend
            dockerfile: backend/src/Presentation/Cinedex.DatabaseMigrator/Dockerfile
            title: Cinedex Database Migrator
            readme: backend/src/Presentation/Cinedex.DatabaseMigrator/README.md
          - name: schedulerworker
            context: ./backend
            dockerfile: backend/src/Presentation/Cinedex.SchedulerWorker/Dockerfile
            title: Cinedex Scheduler Worker
            readme: backend/src/Presentation/Cinedex.SchedulerWorker/README.md
          - name: app
            context: ./frontend
            dockerfile: frontend/apps/cinedex-app/Dockerfile
            title: Cinedex App
            readme: frontend/apps/cinedex-app/README.md
          - name: storybook
            context: ./frontend
            dockerfile: frontend/apps/storybook/Dockerfile
            title: Cinedex Storybook
            readme: frontend/apps/storybook/README.md
          # Root context: /changelog is generated from the root CHANGELOG.md.
          - name: docs-site
            context: .
            dockerfile: frontend/apps/docs-site/Dockerfile
            title: Cinedex Docs Site
            readme: frontend/apps/docs-site/README.md
            build-args: |
              DOCUSAURUS_BASE_URL=/documentation/
              STORYBOOK_BASE_URL=https://cinedex.online/storybook

    steps:
      - uses: actions/checkout@v6

      # The frontend workspace root's version is the repo's release version—the
      # release bumps it and backend/Directory.Build.props in one step, so either
      # would serve. This one reads without the .NET SDK, which this job (unlike
      # the backend one) does not install; node is preinstalled on ubuntu-latest.
      # The guard keeps a missing version from tagging six images "undefined".
      - id: version
        run: |
          version="$(node -p "require('./frontend/package.json').version")"
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "No version field in frontend/package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Tagging images \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      # A Docker tag admits only [A-Za-z0-9_.-] and cannot lead with . or -,
      # while a branch name can hold slashes and much else, so the ref name is
      # squashed to that set before it becomes a tag. Only non-main dispatches
      # use it; on main it is computed and ignored.
      - id: slug
        run: |
          slug="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[.-]*//')"
          slug="${slug:0:100}"
          if [ -z "$slug" ]; then
            echo "Could not derive a tag slug from ref '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The GHCR description is the image README's opening paragraph—the text
      # between the H1 and the first blank line—so the registry blurb and the
      # doc cannot drift apart. Newlines collapse to spaces because a label is
      # a single value and several of these paragraphs are hard-wrapped; the
      # text is otherwise passed through verbatim, markdown and all, which is
      # what the registry will render literally (it does not parse markdown).
      # A missing file or empty paragraph fails the job rather than shipping
      # an image whose description silently falls back to the repository's.
      - id: description
        run: |
          readme='${{ matrix.readme }}'
          if [ ! -f "$readme" ]; then
            echo "No README at $readme" >&2
            exit 1
          fi
          description="$(awk '
            NR == 1 { next }
            /^[[:space:]]*$/ { if (seen) exit; next }
            { seen = 1; printf "%s%s", sep, $0; sep = " " }
          ' "$readme")"
          if [ -z "$description" ]; then
            echo "No opening paragraph in $readme" >&2
            exit 1
          fi
          echo "description=$description" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.name }}: $description" >> "$GITHUB_STEP_SUMMARY"

      # Also emits org.opencontainers.image.source, which links the GHCR
      # package back to this repository.
      #
      # GHCR has no per-image README: the body of a package page is the README
      # of whatever repository `source` points at, so all six necessarily show
      # this repo's root one. The only per-image prose the registry renders is
      # `description`, the line beneath the package name—which otherwise
      # defaults to the repository description, identical across all six. The
      # description step above carries the per-image text.
      #
      # It has to be set twice. Labels live in the image config, which GHCR
      # reads only for a plain single-arch image; when the push produces a
      # manifest list—any multi-arch build, and also a single-platform one
      # once build-push-action v6 attaches its default provenance
      # attestation—the package page reads the description off the index
      # instead, and an unannotated index falls back to the repository
      # description. So the same two keys go out as annotations as well.
      # metadata-action writes those at `manifest` level by default; `index`
      # is the level GHCR actually reads, and naming both keeps this correct
      # whichever shape the push takes.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          # `latest` and the bare release version are main's to own. A dispatch
          # off any other ref publishes under that ref's slug instead
          # (`branch-my-feature`), so a hand-run build can be pulled and tried
          # without displacing what production resolves `latest` to. The sha tag
          # is unconditional and unique either way.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=branch-${{ steps.slug.outputs.slug }},enable=${{ github.ref != 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ steps.description.outputs.description }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ steps.description.outputs.description }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ matrix.build-args }}
          # Scoped per image or the six builds evict each other's cache.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
