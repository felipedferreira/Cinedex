name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v6

    # backend/CHANGELOG.md is a build-managed copy of the root CHANGELOG.md (the Docker build
    # context is ./backend, so the image build cannot see the root file). Only the root file is
    # edited by hand; a local backend build refreshes the copy. Fail fast if they have drifted.
    - name: Verify backend/CHANGELOG.md matches root CHANGELOG.md
      working-directory: .
      run: |
        if ! cmp -s CHANGELOG.md backend/CHANGELOG.md; then
          echo "::error file=backend/CHANGELOG.md::backend/CHANGELOG.md is out of sync with the root CHANGELOG.md. Edit only the root file, then run 'cp CHANGELOG.md backend/CHANGELOG.md' (or a local backend build) and commit."
          diff -u CHANGELOG.md backend/CHANGELOG.md || true
          exit 1
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: backend/global.json

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: backend/src/Presentation/Cinedex.WebService/package-lock.json

    - name: Install web dependencies
      working-directory: backend/src/Presentation/Cinedex.WebService
      run: npm ci

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      run: >
        dotnet test --no-build --configuration Release --verbosity normal
        --logger "liquid.md;LogFileName=test-results.md"
        --results-directory TestResults

    - name: Publish test summary
      if: always()
      run: |
        if [ -f TestResults/test-results.md ]; then
          cat TestResults/test-results.md >> "$GITHUB_STEP_SUMMARY"
        else
          echo "No test report was generated." >> "$GITHUB_STEP_SUMMARY"
        fi

  frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    # `frontend/` is an npm workspace root (apps/* + packages/*); every script
    # below fans out to the workspaces from here.
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # Repo-wide rule, not a frontend one, but it lives in this job because this
    # job already has Node set up and is already required to merge — a separate
    # job would need a branch-protection change before it could gate anything.
    # The script is dependency-free, so it runs before `npm ci` and fails fast.
    - name: Check diagrams (no ASCII box art)
      working-directory: .
      run: node scripts/check-diagrams.mjs

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Check formatting
      run: npm run format:check

    - name: Build
      run: npm run build

    - name: Build Storybook
      run: npm run build-storybook

    - name: Run tests with coverage
      run: npm run coverage

    # One report per workspace — the action reads a single coverage directory,
    # and the distinct names keep the two job summaries apart.
    - name: Coverage summary (cinadex-app)
      if: always()
      uses: davelosert/vitest-coverage-report-action@v2
      with:
        name: cinadex-app
        working-directory: frontend/apps/cinadex-app

    - name: Coverage summary (@cinedex/components)
      if: always()
      uses: davelosert/vitest-coverage-report-action@v2
      with:
        name: '@cinedex/components'
        working-directory: frontend/packages/components
