name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: [self-hosted, cinedex, production]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      # backend/CHANGELOG.md is a build-managed copy of the root CHANGELOG.md (the Docker build
      # context is ./backend, so the image build cannot see the root file). Only the root file is
      # edited by hand; a local backend build refreshes the copy. Fail fast if they have drifted.
      - name: Verify backend/CHANGELOG.md matches root CHANGELOG.md
        working-directory: .
        run: |
          if ! cmp -s CHANGELOG.md backend/CHANGELOG.md; then
            echo "::error file=backend/CHANGELOG.md::backend/CHANGELOG.md is out of sync with the root CHANGELOG.md. Edit only the root file, then run 'cp CHANGELOG.md backend/CHANGELOG.md' (or a local backend build) and commit."
            diff -u CHANGELOG.md backend/CHANGELOG.md || true
            exit 1
          fi

      - name: Install web dependencies
        working-directory: backend/src/Presentation/Cinedex.WebService
        run: npm ci

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "liquid.md;LogFileName=test-results.md"
          --results-directory TestResults

      - name: Publish test summary
        if: always()
        run: |
          if [ -f TestResults/test-results.md ]; then
            cat TestResults/test-results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    runs-on: [self-hosted, cinedex, production]

    # `frontend/` is an npm workspace root (apps/* + packages/*); every script
    # below validates or builds the workspaces from here. Coverage runs in the
    # explicit dependency chain that follows this job.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      # Repo-wide rule, not a frontend one, but it lives in this job because this
      # job already has Node available and is already required to merge. The script
      # is dependency-free, so it runs before `npm ci` and fails fast.
      - name: Check diagrams (no ASCII box art)
        working-directory: .
        run: node scripts/check-diagrams.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  frontend-atoms:
    name: Frontend · atoms
    needs: frontend
    runs-on: [self-hosted, cinedex, production]

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage -w @cinedex/atoms

      - name: Coverage summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@cinedex/atoms"
          working-directory: frontend/packages/atoms

  frontend-compounds:
    name: Frontend · compounds
    needs: frontend-atoms
    runs-on: [self-hosted, cinedex, production]

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage -w @cinedex/compounds

      - name: Coverage summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@cinedex/compounds"
          working-directory: frontend/packages/compounds

  frontend-solution:
    name: Frontend · solution
    needs: frontend-compounds
    runs-on: [self-hosted, cinedex, production]

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage -w @cinedex/solution

      - name: Coverage summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@cinedex/solution"
          working-directory: frontend/packages/solution

  frontend-app:
    name: Frontend · cinedex-app
    needs: frontend-solution
    runs-on: [self-hosted, cinedex, production]

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage -w cinedex-app

      - name: Coverage summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: cinedex-app
          working-directory: frontend/apps/cinedex-app
