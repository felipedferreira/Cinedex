name: Deploy storybook

# A thin caller: it names the service and hands off. The deploy body lives in
# deploy.yml—see that file for what actually happens.
on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: Image tag to deploy, e.g. sha-abc1234. Defaults to latest, the tag CI moves to the newest main build.
        required: false
        default: latest
        type: string
  workflow_call:
    inputs:
      image-tag:
        description: Image tag to deploy, e.g. sha-abc1234. Defaults to latest.
        required: false
        default: latest
        type: string

permissions:
  contents: read
  # The called workflow pulls the image manifest from GHCR, and a reusable
  # workflow cannot request more than its caller grants—without this the run
  # fails at parse time with startup_failure and no log.
  packages: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      service-name: storybook
      image: ghcr.io/felipedferreira/cinedex-storybook
      image-tag: ${{ inputs.image-tag || 'latest' }}
      app-id-secret: DOKPLOY_APP_ID_STORYBOOK
      webhook-secret: DOKPLOY_WEBHOOK_STORYBOOK
