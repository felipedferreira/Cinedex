services:
  postgres:
    image: postgres:17-alpine
    container_name: movies-db
    environment:
      POSTGRES_USER: movies_rw
      # Read from the git-ignored .env; must match the password in DB_CONNECTION_STRING.
      # Only used when the postgres_data volume is initialized for the first time.
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: movies
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movies_rw -d movies"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Structured logs + traces are ingested by Seq over OTLP.
  # First-run setup: sign in to the UI at http://localhost:5341 as `admin` with the
  # SEQ_ADMIN_PASSWORD from your .env. Seq will require you to choose a permanent
  # password on first login. Create an API key under Settings -> API Keys, set its
  # token to the SEQ_API_KEY value, then restart movies.webservice.
  # CI alternative: `seqcli apikey create --token=$SEQ_API_KEY`.
  seq:
    image: datalust/seq:latest
    container_name: movies-seq
    environment:
      ACCEPT_EULA: "Y"
      # Used only when the seq_data volume is empty. After first login, Seq stores
      # the changed admin password in /data and this value no longer updates it.
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_ADMIN_PASSWORD}"
    ports:
      # Pinned to IPv4 loopback on purpose: a bare "5341:80" also binds [::]:5341, and on
      # Docker Desktop / Windows the IPv6 path for `localhost` (::1) accepts the connection
      # but fails to relay data. Binding IPv4 only makes `localhost` fall back to 127.0.0.1.
      - "127.0.0.1:5341:80"   # Seq UI + OTLP/native ingestion -> http://localhost:5341
    volumes:
      - seq_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local dev mail sink: captures every email the web service sends and shows it in a web UI
  # at http://localhost:8025 — nothing is delivered to real inboxes. SMTP AUTH is validated
  # against a password file we generate at startup from the MAILPIT_SMTP_* values in .env
  # (MP_SMTP_AUTH_ACCEPT_ANY stays at its default of false), so no credentials are baked into
  # the image or committed to git. Point the web service's SMTP client at mailpit:1025.
  mailpit:
    # Pinned to match the tag SmtpEmailSenderTests starts as a Testcontainer, so a Mailpit release
    # cannot change local dev behaviour without an explicit bump here.
    image: axllent/mailpit:v1.30.0
    container_name: movies-mailpit
    environment:
      # Rolling buffer; the oldest messages are pruned once this many are stored (500 is the
      # default — set explicitly here for visibility). Use 0 for unlimited retention.
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_FILE: /tmp/smtp-auth
      # The dev SMTP connection is plaintext (no STARTTLS), so allow AUTH over it; without this
      # Mailpit rejects the login before it ever checks the credentials.
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MAILPIT_SMTP_USER: "${MAILPIT_SMTP_USER}"
      MAILPIT_SMTP_PASSWORD: "${MAILPIT_SMTP_PASSWORD}"
    # Write the "user:password" auth file from .env before launching Mailpit. The doubled $$
    # escapes Compose interpolation so the shell inside the container expands the vars at runtime.
    entrypoint:
      - /bin/sh
      - -c
      - printf '%s:%s' "$$MAILPIT_SMTP_USER" "$$MAILPIT_SMTP_PASSWORD" > /tmp/smtp-auth && exec /mailpit
    ports:
      # Loopback-only, like Seq — these are developer tools, not part of the app's public surface.
      - "127.0.0.1:8025:8025"   # Web UI -> http://localhost:8025
      - "127.0.0.1:1025:1025"   # SMTP endpoint the web service connects to (host mailpit, port 1025)
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  movies.webservice:
    image: movies.webservice
    build:
      context: ./backend
      dockerfile: src/Presentation/Cinedex.WebService/Dockerfile
    container_name: movies-web
    expose:
      # The API is reached through the HTTPS frontend reverse proxy so Secure auth cookies
      # are set on an HTTPS response and stay same-origin with the SPA.
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The app sits behind the cinadex-ui Nginx proxy; honor its X-Forwarded-* headers so
      # the request scheme and client address are the originals, not http and the proxy IP.
      ForwardedHeaders__Enabled: "true"
      Features__ApiDocumentationEnabled: "true"
      ConnectionStrings__DefaultConnection: "${DB_CONNECTION_STRING}"
      Kestrel__Endpoints__Http__Url: "http://0.0.0.0:8080"
      # OpenTelemetry -> Seq OTLP ingestion (Seq listens on container port 80)
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://seq/ingest/otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_HEADERS: "X-Seq-ApiKey=${SEQ_API_KEY}"
      OTEL_SERVICE_NAME: "Cinedex.WebService"
      Smtp__Host: "mailpit"
      Smtp__Port: "1025"
      Smtp__Username: "${MAILPIT_SMTP_USER}"
      Smtp__Password: "${MAILPIT_SMTP_PASSWORD}"
      Smtp__FromAddress: "no-reply@cinedex.local"
      Smtp__FromName: "Cinedex"
      Smtp__SecureSocketOptions: "None"

  cinadex-ui:
    image: cinadex-ui
    build:
      context: ./frontend/cinadex-ui
    container_name: cinadex-ui
    ports:
      - "127.0.0.1:9000:443"
    depends_on:
      - movies.webservice

volumes:
  postgres_data:
  seq_data:
