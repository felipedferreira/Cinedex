server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Emit relative Location headers on nginx-generated redirects. The container listens on 80 but
    # is published on host port 9001, so an absolute redirect would rebuild the URL without :9001
    # and send browsers to a port nothing listens on.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # This container serves the bundle under `/storybook/`, the public path it is deployed at, and
    # the proxy in front of it forwards that prefix intact rather than stripping it. That is
    # deliberate, and the two redirects below are the reason: `storybook build` emits every
    # reference relative (`./sb-manager/runtime.js`, `./assets/*`, `./brand.svg`), so the bundle
    # runs under any prefix — but only when the browser's URL ends in a slash. Hit `/storybook`
    # without one and the browser resolves `./sb-manager/runtime.js` against the *parent*,
    # requesting `/sb-manager/runtime.js` at the site root, where the SPA's `try_files ...
    # /index.html` catch-all answers with HTML at 200. The result is a blank Storybook, no error
    # anywhere, and a green build. Only nginx can issue the corrective redirect, and only if it can
    # see the prefix — hence no path stripping upstream.
    #
    # The `/` redirect is what keeps the bare http://localhost:9001 that Compose publishes working.
    location = / {
        return 308 /storybook/;
    }

    location = /storybook {
        return 308 /storybook/;
    }

    # Keep the prefix visible to the browser while dropping it for the static-file lookup — the
    # same shape apps/docs-site/nginx.conf uses.
    #
    # Storybook is a static bundle that routes through query parameters (?path=/story/...), so this
    # only needs to serve files and fall back to the shell. iframe.html is a real file and is
    # matched by $uri before the fallback.
    location /storybook/ {
        rewrite ^/storybook/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }
}
