# Pinned so the project name — and therefore container and volume names like
# cinedex_postgres_data — is the same for everyone regardless of what the clone directory is
# called. Compose otherwise derives it from the directory name, which would give a teammate who
# cloned into a differently-named folder their own separate set of volumes.
name: cinedex

services:
  postgres:
    image: postgres:17-alpine
    container_name: movies-db
    environment:
      POSTGRES_USER: movies_rw
      # Read from the git-ignored .env; must match the password in DB_CONNECTION_STRING.
      # Only used when the postgres_data volume is initialized for the first time.
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: movies
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movies_rw -d movies"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Structured logs + traces are ingested by Seq over OTLP.
  # First-run setup: sign in to the UI at http://localhost:5341 as `admin` with the
  # SEQ_ADMIN_PASSWORD from your .env. Seq will require you to choose a permanent
  # password on first login. Create an API key under Settings -> API Keys, set its
  # token to the SEQ_API_KEY value, then restart movies.webservice.
  # CI alternative: `seqcli apikey create --token=$SEQ_API_KEY`.
  seq:
    image: datalust/seq:latest
    container_name: movies-seq
    environment:
      ACCEPT_EULA: "Y"
      # Used only when the seq_data volume is empty. After first login, Seq stores
      # the changed admin password in /data and this value no longer updates it.
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_ADMIN_PASSWORD}"
    ports:
      # Pinned to IPv4 loopback on purpose: a bare "5341:80" also binds [::]:5341, and on
      # Docker Desktop / Windows the IPv6 path for `localhost` (::1) accepts the connection
      # but fails to relay data. Binding IPv4 only makes `localhost` fall back to 127.0.0.1.
      - "127.0.0.1:5341:80"   # Seq UI + OTLP/native ingestion -> http://localhost:5341
    volumes:
      - seq_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local dev mail sink: captures every email the web service sends and shows it in a web UI
  # at http://localhost:8025. Nothing is delivered to real inboxes.
  mailpit:
    # Pinned to match the tag SmtpEmailSenderTests starts as a Testcontainer.
    image: axllent/mailpit:v1.30.0
    container_name: movies-mailpit
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_FILE: /tmp/smtp-auth
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MAILPIT_SMTP_USER: "${MAILPIT_SMTP_USER}"
      MAILPIT_SMTP_PASSWORD: "${MAILPIT_SMTP_PASSWORD}"
    entrypoint:
      - /bin/sh
      - -c
      - printf '%s:%s' "$$MAILPIT_SMTP_USER" "$$MAILPIT_SMTP_PASSWORD" > /tmp/smtp-auth && exec /mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  movies.databasemigrator:
    image: movies.databasemigrator
    build:
      context: ./backend
      dockerfile: src/Presentation/Cinedex.DatabaseMigrator/Dockerfile
    container_name: movies-database-migrator
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "${DB_CONNECTION_STRING}"
      # OpenTelemetry -> Seq OTLP ingestion (Seq listens on container port 80)
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://seq/ingest/otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_HEADERS: "X-Seq-ApiKey=${SEQ_API_KEY}"
      OTEL_SERVICE_NAME: "Cinedex.DatabaseMigrator"
    restart: "no"

  movies.webservice:
    image: movies.webservice
    build:
      context: ./backend
      dockerfile: src/Presentation/Cinedex.WebService/Dockerfile
    container_name: movies-web
    expose:
      # The API is reached through the HTTPS edge proxy so Secure auth cookies
      # are set on an HTTPS response and stay same-origin with the SPA.
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      movies.databasemigrator:
        condition: service_completed_successfully
      seq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The app sits behind the Caddy edge proxy; honor its X-Forwarded-* headers so
      # the request scheme and client address are the originals, not http and the proxy IP.
      ForwardedHeaders__Enabled: "true"
      Features__ApiDocumentationEnabled: "true"
      ConnectionStrings__DefaultConnection: "${DB_CONNECTION_STRING}"
      Kestrel__Endpoints__Http__Url: "http://0.0.0.0:8080"
      # OpenTelemetry -> Seq OTLP ingestion (Seq listens on container port 80)
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://seq/ingest/otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_HEADERS: "X-Seq-ApiKey=${SEQ_API_KEY}"
      OTEL_SERVICE_NAME: "Cinedex.WebService"
      Smtp__Host: "mailpit"
      Smtp__Port: "1025"
      Smtp__Username: "${MAILPIT_SMTP_USER}"
      Smtp__Password: "${MAILPIT_SMTP_PASSWORD}"
      Smtp__FromAddress: "no-reply@cinedex.local"
      Smtp__FromName: "Cinedex"
      Smtp__SecureSocketOptions: "None"

  # Long-running background worker for scheduled jobs. No ports: it serves no traffic.
  movies.schedulerworker:
    image: movies.schedulerworker
    build:
      context: ./backend
      dockerfile: src/Presentation/Cinedex.SchedulerWorker/Dockerfile
    container_name: movies-scheduler-worker
    depends_on:
      postgres:
        condition: service_healthy
      movies.databasemigrator:
        condition: service_completed_successfully
      seq:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "${DB_CONNECTION_STRING}"
      # OpenTelemetry -> Seq OTLP ingestion (Seq listens on container port 80)
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://seq/ingest/otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_HEADERS: "X-Seq-ApiKey=${SEQ_API_KEY}"
      OTEL_SERVICE_NAME: "Cinedex.SchedulerWorker"

  cinadex-app:
    image: cinadex-app
    build:
      # The frontend is an npm workspace: the context has to be the workspace
      # root so the build can see the hoisted lockfile and the @cinedex/*
      # library packages the app depends on.
      context: ./frontend
      dockerfile: apps/cinadex-app/Dockerfile
    container_name: cinadex-app
    expose:
      - "8080"

  # The local HTTPS edge. Caddy creates its development CA and localhost certificate at runtime
  # and persists them in caddy_data, so no private key is baked into the frontend image. It also
  # keeps the SPA and API same-origin, which the Secure, SameSite=Strict refresh cookie requires.
  cinedex-edge:
    image: caddy:2.11.4-alpine
    container_name: cinedex-edge
    ports:
      - "127.0.0.1:9000:443"
    volumes:
      - ./frontend/apps/cinadex-app/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cinadex-app
      - movies.webservice

  # The component libraries' Storybook, served as a static bundle. No depends_on and no API proxy —
  # it renders @cinedex/atoms, /compounds and /solution in isolation and calls nothing.
  cinedex-storybook:
    image: cinedex-storybook
    build:
      context: ./frontend
      dockerfile: apps/storybook/Dockerfile
    container_name: cinedex-storybook
    ports:
      - "127.0.0.1:9001:80"

volumes:
  postgres_data:
  seq_data:
  caddy_data:
  caddy_config:
