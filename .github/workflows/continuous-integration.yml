name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the images job be run by hand from any branch while it's being
  # proven out, without waiting for a merge to main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: [self-hosted, cinedex, production]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "liquid.md;LogFileName=test-results.md"
          --results-directory TestResults

      - name: Publish test summary
        if: always()
        run: |
          if [ -f TestResults/test-results.md ]; then
            cat TestResults/test-results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    runs-on: [self-hosted, cinedex, production]

    permissions:
      contents: read
      pull-requests: write

    # `frontend/` is an npm workspace root (apps/* + packages/*); every script
    # below fans out to the workspaces from here.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      # Repo-wide rule, not a frontend one, but it lives in this job because this
      # job already has Node available and is already required to merge. The script
      # is dependency-free, so it runs before `npm ci` and fails fast.
      - name: Check diagrams (no ASCII box art)
        working-directory: .
        run: node scripts/check-diagrams.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run coverage

      # One report per workspace—the action reads a single coverage directory,
      # and the distinct names keep the job summaries apart.
      - name: Coverage summary (cinedex-app)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: cinedex-app
          working-directory: frontend/apps/cinedex-app

      # One per library tier. @cinedex/theme is absent on purpose—it ships CSS
      # and no JavaScript, so it has no test suite to report on.
      - name: Coverage summary (@cinedex/atoms)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@cinedex/atoms"
          working-directory: frontend/packages/atoms

      - name: Coverage summary (@cinedex/compounds)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@cinedex/compounds"
          working-directory: frontend/packages/compounds

      - name: Coverage summary (@cinedex/solution)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@cinedex/solution"
          working-directory: frontend/packages/solution

  images:
    name: Build & push ${{ matrix.name }}
    needs: [backend, frontend]
    # Manual trigger for proving this out from a branch; otherwise only a
    # push that lands on main, once both test jobs are green.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/felipedferreira/cinedex
    strategy:
      # One broken image should not hide the state of the other five.
      fail-fast: false
      matrix:
        include:
          - name: webservice
            context: ./backend
            dockerfile: backend/src/Presentation/Cinedex.WebService/Dockerfile
          - name: migrator
            context: ./backend
            dockerfile: backend/src/Presentation/Cinedex.DatabaseMigrator/Dockerfile
          - name: schedulerworker
            context: ./backend
            dockerfile: backend/src/Presentation/Cinedex.SchedulerWorker/Dockerfile
          - name: app
            context: ./frontend
            dockerfile: frontend/apps/cinedex-app/Dockerfile
          - name: storybook
            context: ./frontend
            dockerfile: frontend/apps/storybook/Dockerfile
          # Root context: /changelog is generated from the root CHANGELOG.md.
          - name: docs-site
            context: .
            dockerfile: frontend/apps/docs-site/Dockerfile
            build-args: |
              DOCUSAURUS_BASE_URL=/documentation/
              STORYBOOK_BASE_URL=https://cinedex.online/storybook

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also emits org.opencontainers.image.source, which links the GHCR
      # package back to this repository.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          # Scoped per image or the six builds evict each other's cache.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
