server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # The container listens on 80 but Compose publishes it on host port 9004.
    # Relative redirects preserve that external port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /documentation/404.html;

    location = / {
        return 308 /documentation/;
    }

    location = /documentation {
        return 308 /documentation/;
    }

    # Docusaurus generates links and asset URLs with this public base path.
    # Keep it visible to the browser while stripping it only for the static-file lookup.
    location /documentation/ {
        rewrite ^/documentation/(.*)$ /$1 break;
        try_files $uri $uri/ $uri.html =404;
    }

    location = /documentation/404.html {
        rewrite ^/documentation/(.*)$ /$1 break;
        internal;
    }
}
