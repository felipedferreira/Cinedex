server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # The container listens on 80 but Compose publishes it on host port 9004.
    # Relative redirects preserve that external port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # This image is served behind two kinds of proxy and must not care which one
    # is in front:
    #   - Compose's Caddy passes the public /documentation/ prefix through, so
    #     nginx strips it for the static-file lookup. A direct :9004 hit has the
    #     same shape.
    #   - Dokploy's Traefik strips that prefix before the container sees the
    #     request, so the same files must also resolve from the root.
    # Both shapes stay reachable at once because baseUrl is baked into the built
    # HTML as /documentation/ — asset URLs keep the prefix whichever proxy
    # delivered the page, so a stripped page request still pulls prefixed assets.
    #
    # There is deliberately no `location = / { return 308 /documentation/; }`
    # here. Behind a stripping proxy that redirect targets a path the proxy
    # strips straight back to /, which is an infinite redirect loop — verified
    # by restoring the block and watching curl exhaust --max-redirs.
    #
    # The cost is that hitting this container at a bare / in a browser now
    # serves index.html (HTTP 200) and then renders Docusaurus's own "Page Not
    # Found", because the client router compares location.pathname against a
    # baseUrl of /documentation/. That only happens when the *browser's* URL
    # lacks the prefix, which no real deployment produces: Caddy keeps it, and a
    # stripping proxy removes it server-side only. Use the documented direct URL,
    # http://localhost:9004/documentation/.

    error_page 404 /404.html;

    location = /documentation {
        return 308 /documentation/;
    }

    # Prefix still attached: Compose's Caddy, and direct :9004 hits.
    location /documentation/ {
        rewrite ^/documentation/(.*)$ /$1 break;
        try_files $uri $uri/ $uri.html =404;
    }

    # Prefix already stripped by the proxy: Dokploy's Traefik. Also the bare root.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html {
        internal;
    }
}
