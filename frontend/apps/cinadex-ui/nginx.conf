server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Emit relative Location headers on nginx-generated redirects. The container listens on
    # 443 but is published on host port 9000, so an absolute redirect would rebuild the URL
    # without :9000 and send browsers to a port nothing listens on.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = /movies-svc {
        return 308 /movies-svc/;
    }

    location /movies-svc/ {
        proxy_pass http://movies.webservice:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
